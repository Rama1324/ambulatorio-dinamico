name: CI

# Lo que tiene que estar en verde antes de juntar un cambio. Corre en cada pull request (y a mano).
# No usa AWS. Cómo activar los tests (necesitan el dataset sintético, que no va en git): DEPLOY.md, sección "CI/CD".
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plantilla:
    name: Plantilla, conocimiento y paquete
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"   # el mismo del runtime de la Lambda
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            lambda/requirements.txt
      - name: Dependencias de desarrollo
        run: python -m pip install -r requirements-dev.txt
      - name: cfn-lint
        run: cfn-lint template.yaml infra/github-oidc.yaml
      - name: Plantilla (todas las reglas, combinaciones de parámetros y samconfig.toml)
        run: python scripts/validar_plantilla.py
      - name: Base de conocimiento (el manifiesto corresponde a los archivos)
        run: python scripts/empaquetar_conocimiento.py --verificar
      - name: Scripts de despliegue (sintaxis) y paquete de la Lambda para Linux arm64
        run: |
          bash -n scripts/desplegar.sh
          python scripts/desplegar.py --solo-paquete

  # Los tests leen data/perfiles.json, que no está en el repositorio. Si el secreto DATASET_URL no está configurado
  # (o el pull request viene de un fork, que no recibe secretos), los tests NO corren: el trabajo "Tests (pytest)"
  # aparece como omitido y queda un aviso visible. Todo lo que no depende del dataset corre igual.
  dataset:
    name: Dataset sintético disponible
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      disponible: ${{ steps.revisar.outputs.disponible }}
    steps:
      - id: revisar
        env:
          DATASET_URL: ${{ secrets.DATASET_URL }}
        run: |
          if [ -n "$DATASET_URL" ]; then
            echo "disponible=si" >> "$GITHUB_OUTPUT"
            echo "Dataset configurado: los tests van a correr."
          else
            echo "disponible=no" >> "$GITHUB_OUTPUT"
            echo "::warning title=Tests NO ejecutados::Falta el secreto DATASET_URL (o es un pull request desde un fork). pytest no corrió: este cambio NO está probado."
            {
              echo "### Tests NO ejecutados"
              echo "Falta el secreto \`DATASET_URL\` (dataset sintético \`perfiles.json\`) o el pull request viene de un fork."
              echo "Sí corrieron: cfn-lint, validación de la plantilla, base de conocimiento, paquete de la Lambda y build del front."
              echo "Antes de juntar: correr \`python -X utf8 -m pytest -q tests\` en local, o configurar el secreto (DEPLOY.md, sección CI/CD)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  tests:
    name: Tests (pytest)
    needs: dataset
    if: needs.dataset.outputs.disponible == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            lambda/requirements.txt
      - name: Dependencias de desarrollo
        run: python -m pip install -r requirements-dev.txt
      - name: Bajar el dataset sintético
        env:
          DATASET_URL: ${{ secrets.DATASET_URL }}
          DATASET_SHA256: ${{ vars.DATASET_SHA256 }}
        run: |
          mkdir -p data
          curl --fail --silent --show-error --location --retry 3 "$DATASET_URL" --output data/perfiles.json
          if [ -n "$DATASET_SHA256" ]; then
            echo "$DATASET_SHA256  data/perfiles.json" | sha256sum --check --quiet
          fi
          # un enlace vencido suele devolver una página HTML: mejor fallar aquí que con cientos de tests en rojo
          python -c "import json; d = json.load(open('data/perfiles.json', encoding='utf-8')); assert isinstance(d, list) and d, 'no es la lista de perfiles'; print(len(d), 'perfiles')"
      - name: pytest
        run: python -X utf8 -m pytest -q tests

  front:
    name: Front (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"   # Vite 8 pide Node 20.19+ o 22.12+
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run build
