AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Ambulatorio Dinamico HLF - despliegue simple para AWS Academy (Learner Lab).
  Igual que template.yaml pero sin crear roles IAM (usa LabRole) y con el front en un bucket S3 (sitio web estatico).

Parameters:
  RoleArn:
    Type: String
    Description: ARN del rol existente del Learner Lab (arn:aws:iam::<cuenta>:role/LabRole).
  ModelId:
    Type: String
    Default: ""
    Description: ID del modelo de Bedrock. Vacio = explicaciones por plantilla y lectura de informes por palabras clave.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 1024
    Architectures: [arm64]

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # Front: sitio web estatico (React compilado). Solo lectura publica de los archivos del build.
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LecturaPublicaDelFront
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"

  RegistrosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id_paciente
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: id_paciente
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: app.handler
      Role: !Ref RoleArn
      Environment:
        Variables:
          BUCKET: !Ref DataBucket
          PERFILES_KEY: perfiles.json
          BOX_KEY: box.json
          TABLE: !Ref RegistrosTable
          MODEL_ID: !Ref ModelId
          BEDROCK_REGION: !Ref AWS::Region
      Events:
        Todo:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: URL de la API (VITE_API_URL del front)
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
  DataBucket:
    Description: Bucket privado con perfiles.json y box.json
    Value: !Ref DataBucket
  WebBucket:
    Description: Bucket del front (sitio web estatico)
    Value: !Ref WebBucket
  WebUrl:
    Description: URL del front para el equipo
    Value: !GetAtt WebBucket.WebsiteURL
  TableName:
    Value: !Ref RegistrosTable
